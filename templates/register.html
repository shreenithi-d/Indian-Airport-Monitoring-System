{% extends 'base.html' %}

{% block title %}Create Account - {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="aviation-card p-4 p-md-5">
        <div class="text-center mb-4">
          <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="Logo" width="56" height="56" class="mb-2">
          <h4 class="fw-bold text-navy">Passenger Account Registration</h4>
          <p class="text-muted small">Register to track journeys, view interactive maps, and book aircraft seats</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">Full Name <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
              <input type="text" name="full_name" class="form-select" placeholder="e.g. Rahul Verma" required autofocus>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Email Address <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="email" name="email" class="form-select" placeholder="name@example.com" required>
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Phone Number</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-telephone"></i></span>
                <input type="tel" name="phone_number" class="form-select" placeholder="+91 98765 43210">
              </div>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" id="reg-pass" class="form-select" placeholder="Min 6 characters" required>
                <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="#reg-pass">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Confirm Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-shield-check"></i></span>
                <input type="password" name="confirm_password" id="reg-confirm-pass" class="form-select" placeholder="Re-enter password" required>
                <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="#reg-confirm-pass">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-aviation-primary w-100 py-2 mb-3">
            <i class="bi bi-person-check me-1"></i>Complete Registration
          </button>
        </form>

        <div class="text-center small text-muted">
          Already registered? 
          <a href="{{ url_for('auth.login') }}" class="fw-bold text-primary text-decoration-none">Sign In Here</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
